[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, imports, bugbear, pyupgrade, simplify, blind except, subprocess check
select = ["F", "E", "W", "I", "B", "UP", "SIM", "BLE", "PLW1510", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# test tables of real strings and the markdown template read better unwrapped
"tests/*" = ["E501"]
"etl/gen_data_dictionary.py" = ["E501"]
